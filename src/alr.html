<div class="alr" id="alr" hidden role="dialog" aria-label="Будильник">
  <div class="alr-top"><strong>Будильник</strong><button class="ghost" id="alrClose" type="button">Закрыть</button></div>
  <input class="alr-time" id="alrTime" type="time" value="07:00" aria-label="Время">
  <label>Что играть <select id="alrTrack"></select></label>
  <div class="alr-days" id="alrDays"></div>
  <label>Плавно нарастать (секунд) <select id="alrFade"><option value="10">10</option><option value="30" selected>30</option><option value="60">60</option><option value="120">120</option></select></label>
  <button class="ghost" id="alrToggle" type="button">Включить будильник</button>
  <div class="alr-state" id="alrState"></div>
  <div class="alr-note">Честно: будильник в приложении звонит только пока «Моя музыка» открыта и телефон не заблокирован как «спящий». Оставь приложение на экране, поставь телефон на зарядку: экран не погаснет сам. Для страховки поставь ещё и обычный будильник на телефоне.</div>
</div>
<div class="alr-ring" id="alrRing" hidden>
  <div class="big" id="alrClock">07:00</div>
  <button class="stop" id="alrStop" type="button">Выключить</button>
  <button class="snz" id="alrSnooze" type="button">Ещё 5 минут</button>
</div>
